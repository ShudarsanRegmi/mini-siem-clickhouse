apiVersion: 1

datasources:
  - name: ClickHouse-SIEM
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      secure: false
      username: ${CLICKHOUSE_GRAFANA_USER}
      defaultDatabase: siem
    secureJsonData:
      password: ${CLICKHOUSE_GRAFANA_PASSWORD}
    editable: false
