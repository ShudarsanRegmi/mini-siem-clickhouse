# ==============================================================================
# Mini SIEM Infrastructure Stack
# Security Hardening:
#  - Localhost binding only (127.0.0.1) prevents exposure to external networks
#  - Least privilege database users configured via RBAC
#  - Gateway runs as unprivileged non-root container user
#  - No hardcoded passwords in configuration
# ==============================================================================

networks:
  siem_net:
    driver: bridge

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: siem_clickhouse
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"  # HTTP interface (Localhost only)
      - "127.0.0.1:9000:9000"  # Native TCP interface (Localhost only)
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-siem}
      CLICKHOUSE_USER: ${CLICKHOUSE_ADMIN_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:-admin}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./config/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - siem_net

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siem_gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"  # Ingestion Gateway (Localhost only)
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-siem}
      - CLICKHOUSE_INGEST_USER=${CLICKHOUSE_INGEST_USER:-siem_ingest}
      - CLICKHOUSE_INGEST_PASSWORD=${CLICKHOUSE_INGEST_PASSWORD}
      - INGESTION_BEARER_TOKEN=${INGESTION_BEARER_TOKEN}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - siem_net

  grafana:
    image: grafana/grafana:10.4.2
    container_name: siem_grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"  # Web UI (Localhost only)
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
      - CLICKHOUSE_GRAFANA_USER=${CLICKHOUSE_GRAFANA_USER:-siem_grafana}
      - CLICKHOUSE_GRAFANA_PASSWORD=${CLICKHOUSE_GRAFANA_PASSWORD:-siem_grafana_pass}
    volumes:
      - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - siem_net

volumes:
  clickhouse_data:
  grafana_data:
