[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Fast unit tests with no external dependencies
    integration: Integration tests requiring ClickHouse or local services
    security: Security assurance, authentication, and RBAC tests
    e2e: End-to-end full lifecycle workflow tests
addopts = -ra -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning:starlette.*:
