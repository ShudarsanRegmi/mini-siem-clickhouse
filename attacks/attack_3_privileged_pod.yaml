apiVersion: v1
kind: Pod
metadata:
  name: privileged-escape-pod
  namespace: default
  labels:
    app: escape-test
    role: attacker
spec:
  restartPolicy: Never
  containers:
  - name: exploit-container
    image: busybox:1.36
    command: ["sleep", "60"]
    securityContext:
      privileged: true
      allowPrivilegeEscalation: true
    volumeMounts:
    - name: host-root
      mountPath: /host
  volumes:
  - name: host-root
    hostPath:
      path: /
