apiVersion: v1
kind: Pod
metadata:
  name: k8s-killchain-escape-pod
  namespace: default
  labels:
    role: correlated-attacker
    attack-stage: host-escape
spec:
  restartPolicy: Never
  containers:
  - name: escape-agent
    image: busybox:1.36
    command: ["sleep", "60"]
    securityContext:
      privileged: true
      allowPrivilegeEscalation: true
    volumeMounts:
    - name: host-filesystem
      mountPath: /host
  volumes:
  - name: host-filesystem
    hostPath:
      path: /
